<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spending Tracker - Bubble Categorizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>💰 Spending Tracker</h1>
            <p class="subtitle">Drag transactions into vaults to categorize</p>
        </header>

        <div class="upload-section">
            <label class="upload-btn" for="pdfUpload">
                📄 Upload Statement (PDF)
            </label>
            <input type="file" id="pdfUpload" accept=".pdf" multiple hidden>
            <span class="upload-hint">Supports CommBank & Amex statements</span>
        </div>

        <div class="main-layout">
            <div class="uncategorized-section">
                <div class="section-header">
                    <h2>📥 Uncategorized</h2>
                    <span class="count" id="uncategorizedCount">0</span>
                </div>
                <div class="bubble-container" id="uncategorized" data-vault="uncategorized"></div>
            </div>

            <div class="vaults-section">
                <div class="section-header">
                    <h2>🏦 Vaults</h2>
                    <button class="add-vault-btn" id="addVaultBtn">+ Add Vault</button>
                </div>
                <div class="vaults-grid" id="vaultsGrid">
                    <!-- Vaults will be inserted here -->
                </div>
            </div>
        </div>

        <div class="summary-bar" id="summaryBar">
            <div class="summary-item">
                <span class="summary-label">Total Transactions</span>
                <span class="summary-value" id="totalTx">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Categorized</span>
                <span class="summary-value" id="categorizedTx">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Total Spending</span>
                <span class="summary-value" id="totalSpending">$0</span>
            </div>
            <div class="summary-actions">
                <button class="action-btn" id="exportBtn">📊 Export CSV</button>
                <button class="action-btn" id="clearBtn">🗑️ Clear All</button>
            </div>
        </div>
    </div>

    <!-- Vault modal -->
    <div class="modal" id="vaultModal">
        <div class="modal-content">
            <h3>Create New Vault</h3>
            <input type="text" id="vaultName" placeholder="Vault name (e.g., Groceries)">
            <input type="text" id="vaultEmoji" placeholder="Emoji (e.g., 🛒)" maxlength="2">
            <input type="number" id="vaultBudget" placeholder="Monthly budget (optional)">
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelVault">Cancel</button>
                <button class="btn-primary" id="saveVault">Create</button>
            </div>
        </div>
    </div>

    <script src="js/parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
